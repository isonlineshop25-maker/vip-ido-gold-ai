name: Maak APK
on:
  workflow_dispatch:
    inputs:
      url:  { description: "Webadres van het dashboard", default: "https://46-101-189-172.sslip.io" }
      naam: { description: "Naam van de app", default: "VIP IDO GOLD" }
      id:   { description: "App-id (klein, zonder spaties)", default: "nl.ido.gold" }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Android-licenties accepteren (SDK staat al op de runner)
        run: yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Bouw de APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PappUrl="${{ inputs.url || 'https://46-101-189-172.sslip.io' }}" -PappName="${{ inputs.naam || 'VIP IDO GOLD' }}" -PappId="${{ inputs.id || 'nl.ido.gold' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ido-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
